name: macOS context preview
on:
  push:
    branches: [build/macos-context-test]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d2423f8e2fdd592e0a04254d2c7d67b9b0ee73fc
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-context-arm64
      - run: pnpm install --frozen-lockfile
      - name: Build standalone Apple Silicon test app
        run: |
          test "$(git rev-parse HEAD)" = "d2423f8e2fdd592e0a04254d2c7d67b9b0ee73fc"
          pnpm exec tauri build --target aarch64-apple-darwin --bundles app --config '{"productName":"OpenIDEA Context Preview","identifier":"ai.l0ng.openidea.context-preview","bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}},"plugins":{"updater":{"endpoints":[]}}}'
      - name: Verify and archive app
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/OpenIDEA Context Preview.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "ai.l0ng.openidea.context-preview"
          binary="$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          lipo -verify_arch arm64 "$app/Contents/MacOS/$binary"
          codesign --verify --deep --strict "$app"
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "$app" package/OpenIDEA-Context-Preview-arm64.zip
          cd package
          git rev-parse HEAD > SOURCE_COMMIT.txt
          shasum -a 256 OpenIDEA-Context-Preview-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIDEA-Context-Preview-arm64-d2423f8
          path: package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
